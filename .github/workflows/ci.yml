name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: "1"  # tools.py skips creating the Gemini client: no API keys needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile all Python
        run: python -m compileall -q *.py deploy scripts tests

      - name: Self-checks (no API keys needed)
        run: |
          python prompts.py
          python tools.py
          python deploy/create_sip_trunk.py --self-check

      - name: Unit tests
        run: python -m pytest -q

      - name: Validate YAML
        run: |
          python - <<'PY'
          import glob, yaml
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml*', recursive=True):
              if '.venv' in f:
                  continue
              list(yaml.safe_load_all(open(f)))
              print(f, "OK")
          PY

  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a real-looking secret is committed
        run: |
          # Placeholders (YOUR_*, PLACEHOLDER_*, example, xxxx, fake DID 9000000000) are allowed.
          # Exclude .github (this guard's own regex contains example key prefixes) and .git.
          HITS=$(grep -rnE \
            'sk-[A-Za-z0-9]{20}|sk-proj-|gho_[A-Za-z0-9]{30}|ghp_[A-Za-z0-9]{30}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30}|eyJ[A-Za-z0-9_-]{30}\.[A-Za-z0-9_-]{10}' \
            --include='*.py' --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' \
            --include='*.example' --include='*.service' --include='*.sh' \
            --exclude-dir='.github' --exclude-dir='.git' --exclude-dir='.venv' . \
            | grep -viE 'your_|placeholder|example|xxxx' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Possible secret committed:"; echo "$HITS"; exit 1
          fi
          echo "secret-guard: clean"
